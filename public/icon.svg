<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B4FB0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A2F87;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="turqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3EE0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1FB5B5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- רקע מעוגל -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad2)"/>

  <!-- עיגולים דקורטיביים -->
  <circle cx="256" cy="224" r="155" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.08"/>
  <circle cx="256" cy="224" r="118" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.12"/>

  <!-- סמל ההתאמה -->
  <g transform="translate(256, 218)">
    <path d="M 0,-82 A 82,82 0 0 0 0,82 L 0,36 A 36,36 0 0 1 0,-36 Z"
          fill="#FFFFFF" opacity="0.95"/>
    <path d="M 0,-82 A 82,82 0 0 1 0,82 L 0,36 A 36,36 0 0 0 0,-36 Z"
          fill="url(#turqGrad)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="13" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="29" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2"/>
  </g>

  <!-- ניצוצות -->
  <circle cx="140" cy="148" r="4" fill="#3EE0E0" opacity="0.7"/>
  <circle cx="380" cy="165" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="375" cy="310" r="4" fill="#3EE0E0" opacity="0.5"/>
  <circle cx="128" cy="308" r="3" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="415" cy="248" r="3" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="88" cy="244" r="3" fill="#3EE0E0" opacity="0.5"/>

  <!-- קו מפריד -->
  <line x1="96" y1="358" x2="416" y2="358" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>

  <!-- מקום ריק לפלייסהולדר של הלוגו (יוחלף ע"י sharp) -->
</svg>
